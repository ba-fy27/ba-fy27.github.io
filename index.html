<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブラックエプロン一問一答</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap">
<style>
/* Layout: single centered study column — filters on top, one flash card, grading bar below */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --ink:#1d1b19; --muted:#6c665e; --line:#dcd6cc;
  --accent:#1e5a43; --accent-ink:#fff; --blank:#e7efe9; --ok:#1e7a4c; --ng:#b4442f;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1e1c1a; --ink:#ece8e1; --muted:#a39c92; --line:#36322e;
  --accent:#4fae86; --accent-ink:#0f1411; --blank:#1f3229; --ok:#5cc28f; --ng:#e07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1e1c1a; --ink:#ece8e1; --muted:#a39c92; --line:#36322e;
  --accent:#4fae86; --accent-ink:#0f1411; --blank:#1f3229; --ok:#5cc28f; --ng:#e07a63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem;margin:0}
.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.progress{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.tag{font-size:.75rem;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap}
.tag b{color:var(--accent);font-weight:700}
.q{font-size:1.05rem;font-weight:500;margin:0;word-break:break-word}
.blank{display:inline-block;background:var(--blank);border-radius:6px;padding:0 6px;margin:0 2px;color:var(--accent);font-weight:700}
.blank.filled{color:var(--ink);background:transparent;border-bottom:2px solid var(--accent);border-radius:0;padding:0 2px}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ans div{display:grid;grid-template-columns:1.6em 1fr;gap:6px}
.ans span:first-child{color:var(--accent);font-weight:700}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.ng{color:var(--ng);border-color:var(--ng)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{font-size:.75rem;font-weight:700}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}
.ghost{background:none;border:none;color:var(--muted);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:4px}
.done{text-align:center;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;cursor:pointer;display:grid;grid-template-columns:1.6em 1fr;gap:6px;align-items:baseline;min-width:0;word-break:break-word}
.choice .cn{color:var(--muted);font-weight:700;font-size:.85em}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice[disabled]{cursor:default;opacity:.55}
.choice.right{border-color:var(--ok);color:var(--ok);font-weight:700;opacity:1;border-width:2px}
.choice.wrong{border-color:var(--ng);color:var(--ng);opacity:1;text-decoration:line-through}
.blank.current{background:var(--accent);color:var(--accent-ink)}
.stepn{font-size:.75rem;color:var(--muted)}
.verdict{flex:1 0 100%;text-align:center;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.seg .chip{font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>ブラックエプロン一問一答</h1>
    <p class="sub">コアコーヒー編（p.24–29）</p>
  </header>

  <section class="filters">
    <div class="chips seg" id="fmts"></div>
    <div class="chips" id="cats"></div>
    <select id="coffee" aria-label="コーヒーを選ぶ"></select>
    <div class="chips" id="modes"></div>

  <div>
    <div class="progress"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>

  <article class="card" id="card"></article>

  <div class="row" id="controls"></div>
  <div class="row" style="justify-content:space-between">
    <button class="ghost" id="prev">← 前の問題</button>
    <button class="ghost" id="reset">記録をリセット</button>
  </div>
</div>

 [drip("⑨"),[["⑨","HOTのみ可"]]],
 ["パッケージデザイン　シェイクスピアの（⑩（作品名））の舞台にちなんだコーヒー。象徴的なベロナの赤い（⑪（花の名前））を重ね、噴水、扉、（⑫（国名））のお城のようなディティールを表現している。",[["⑩","ロミオとジュリエット"],["⑪","（赤い）バラ"],["⑫","イタリア"]]],

]},

]},
{cat:"Dark",name:"フレンチ ロースト",items:[

 [drip("⑨"),[["⑨","不可"]]],
 ["パッケージデザイン　（⑩（国名））の建築デザインからインスピレーションを得たシンメトリーが特徴的。この国を象徴する（⑪）は、これまでのデザインに敬意を表している。深煎りに対する経緯を示す（⑫）のモチーフを盛り込む。",[["⑩","フランス"],["⑪","フルール・ド・リス"],["⑫","炎"]]],
 ["このコーヒーは（⑬）年から販売されている。",[["⑬","1971（年）"]]],

];

// flatten
const ALL=[];DATA.forEach((c,ci)=>c.items.forEach((it,ii)=>ALL.push({id:ci+"-"+ii,ci,cat:c.cat,name:c.name,q:it[0],a:it[1],f:it[2]})));

const LS="ba-quiz-v1";
let st={res:{}};try{st=JSON.parse(localStorage.getItem(LS))||st}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};

let cat="すべて",coffee="all",mode="order",fmt="mc",deck=[],pos=0,shown=false,sessOk=0,sessNg=0;
let mc=null; // {step, picked, allOk, sets:[{choices,correct}]}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=a=>a.split("\n")[0].split("　※")[0].trim();
const keyOf=a=>clean(a).replace(/（[^）]*）|\([^)]*\)/g,"").replace(/\s/g,"").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// 問題文中の選択肢（例：（⑨（可/不可）））を取り出す
function inlineOpts(q,n){
  const s=q.indexOf("（"+n+"（");if(s<0)return null;
  const b=s+2,e=q.indexOf("）",b);const body=q.slice(b+1,e);
  const o=body.split(/\s*\/\s*|\s*or\s*/).map(t=>t.trim()).filter(Boolean);
  return o.length>=2?o:null;
}
function poolKey(x,n,a,k){
  if(inlineOpts(x.q,n))return null;
  if(x.f)return x.f+"-"+k;
  if(/^\d{4}/.test(clean(a)))return "year";
  if(/^[\d.]+/.test(clean(a)))return "num";
  return "gen";
}
const POOLS={};
ALL.forEach(x=>x.a.forEach(([n,a],k)=>{const p=poolKey(x,n,a,k);if(!p)return;(POOLS[p]=POOLS[p]||[]).push(clean(a))}));
function makeSet(x,n,a,k){
  const o=inlineOpts(x.q,n);
  if(o){const c=o.find(t=>t===clean(a))||o.find(t=>clean(a).startsWith(t))||o.find(t=>t.startsWith(clean(a)))||clean(a);
    return {choices:o.slice(),correct:c}}
  const ck=keyOf(a),seen=new Set([ck]),wrong=[];
  for(const c of shuffle(POOLS[poolKey(x,n,a,k)]||[])){const kk=keyOf(c);if(seen.has(kk))continue;seen.add(kk);wrong.push(c);if(wrong.length===3)break}
  if(wrong.length<3&&!x.f)for(const c of shuffle(POOLS.gen)){const kk=keyOf(c);if(seen.has(kk))continue;seen.add(kk);wrong.push(c);if(wrong.length===3)break}
  return {choices:shuffle([clean(a),...wrong]),correct:clean(a)};
}
function startMc(){const it=deck[pos];if(!it){mc=null;return}
  mc={step:0,picked:null,allOk:true,sets:it.a.map(([n,a],k)=>makeSet(it,n,a,k))}}

function chips(el,opts,cur,fn){el.innerHTML="";opts.forEach(([v,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",v===cur);b.onclick=()=>fn(v);el.appendChild(b)})}
function renderFilters(){
  chips($("fmts"),[["mc","4択"],["card","一問一答"]],fmt,v=>{fmt=v;build()});
  chips($("cats"),["すべて","総論","Blonde","Medium","Dark"].map(v=>[v,v]),cat,v=>{cat=v;coffee="all";build()});
  const list=DATA.map((c,i)=>[i,c]).filter(([,c])=>cat==="すべて"||c.cat===cat);
  $("coffee").innerHTML=`<option value="all">${cat==="すべて"?"全コーヒー":cat+"のすべて"}（${list.reduce((s,[,c])=>s+c.items.length,0)}問）</option>`+list.map(([i,c])=>`<option value="${i}">${esc(c.name)}（${c.items.length}問）</option>`).join("");
  $("coffee").value=coffee;
  const ng=ALL.filter(x=>st.res[x.id]==="ng").length;
  chips($("modes"),[["order","順番"],["shuffle","シャッフル"],["wrong",`×だけ復習（${ng}）`]],mode,v=>{mode=v;build()});
}
$("coffee").onchange=e=>{coffee=e.target.value;build()};

function build(){
  let pool=ALL.filter(x=>(cat==="すべて"||x.cat===cat)&&(coffee==="all"||String(x.ci)===coffee));
  if(mode==="wrong")pool=pool.filter(x=>st.res[x.id]==="ng");
  deck=mode==="order"?pool.slice():shuffle(pool);
  pos=0;shown=false;sessOk=sessNg=0;startMc();renderFilters();render();
}

// state(i): "filled" | "current" | ""
function qHtml(item,state){
  const map=Object.fromEntries(item.a),idx=Object.fromEntries(item.a.map(([n],i)=>[n,i]));
  return esc(item.q).replace(/（([①-⑳])((?:（[^）]*）|[^（）])*)）/g,(m,n,rest)=>{
    const s=idx[n]===undefined?"":state(idx[n]);
    if(s==="filled")return `<span class="blank filled">${esc(clean(map[n]))}</span>`;
    return `<span class="blank${s==="current"?" current":""}">${n}${rest}</span>`;
  });
}
const ansHtml=it=>`<div class="ans">${it.a.map(([n,a])=>`<div><span>${n}</span><span>${esc(a).replace(/\n/g,"<br>")}</span></div>`).join("")}</div>`;

function render(){
  const total=deck.length;
  $("barfill").style.width=total?(Math.min(pos,total)/total*100)+"%":"0";
  $("score").textContent=`○ ${sessOk}　× ${sessNg}`;
  const card=$("card"),ctr=$("controls");
  if(!total){$("pos").textContent="0 / 0";card.innerHTML=`<p class="done">${mode==="wrong"?"×の問題はありません。":"問題がありません。"}</p>`;ctr.innerHTML="";return}
  if(pos>=total){$("pos").textContent=`${total} / ${total}`;
    card.innerHTML=`<p class="done" style="margin:auto">おつかれさま！<br>○ ${sessOk}問　× ${sessNg}問</p>`;
    ctr.innerHTML=`<button class="btn primary" id="again">もう一度</button>`;$("again").onclick=build;return}
  const it=deck[pos],r=st.res[it.id];
  $("pos").textContent=`${pos+1} / ${total}`;
  const tag=`<div class="tag"><b>${esc(it.cat)}</b><span>${esc(it.name)}</span>${r?`<span class="mark ${r}">前回 ${r==="ok"?"○":"×"}</span>`:""}</div>`;

  if(fmt==="card"){
    card.innerHTML=`${tag}<p class="q">${qHtml(it,()=>shown?"filled":"")}</p>${shown?ansHtml(it):""}`;
    if(!shown){ctr.innerHTML=`<button class="btn primary" id="show">答えを見る</button>`;$("show").onclick=()=>{shown=true;render()}}
    else{ctr.innerHTML=`<button class="btn ng" id="ng">× まちがえた</button><button class="btn ok" id="ok">○ 正解</button>`;
      $("ok").onclick=()=>grade("ok");$("ng").onclick=()=>grade("ng")}
    return;
  }
  // 4択
  const m=mc,last=m.step===it.a.length-1,done=m.picked!==null&&last;
  const state=i=>i<m.step||(i===m.step&&m.picked!==null)?"filled":i===m.step?"current":"";
  const set=m.sets[m.step],[n]=it.a[m.step];
  const multi=it.a.length>1?`<span class="stepn">空欄 ${m.step+1} / ${it.a.length}</span>`:"";
  const ch=`<div class="choices" role="group" aria-label="${n}の選択肢">${set.choices.map((c,i)=>{
    let cls="choice";if(m.picked!==null){if(c===set.correct)cls+=" right";else if(i===m.picked)cls+=" wrong";}
    return `<button class="${cls}" data-i="${i}" ${m.picked!==null?"disabled":""}><span class="cn">${n}</span>${esc(c)}</button>`}).join("")}</div>`;
  card.innerHTML=`${tag}<p class="q">${qHtml(it,state)}</p>${multi}${ch}${done?ansHtml(it):""}`;
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;m.picked=i;if(set.choices[i]!==set.correct)m.allOk=false;render()});
  if(m.picked===null){ctr.innerHTML="";return}
  if(!last){ctr.innerHTML=`<button class="btn primary" id="nx">次の空欄へ</button>`;$("nx").onclick=()=>{m.step++;m.picked=null;render()}}
  else{const g=m.allOk?"ok":"ng";
    ctr.innerHTML=`<div class="verdict ${g}">${g==="ok"?"○ 正解":"× まちがい"}</div><button class="btn primary" id="nx">次の問題へ</button>`;
    $("nx").onclick=()=>grade(g)}
}
function grade(g){st.res[deck[pos].id]=g;save();g==="ok"?sessOk++:sessNg++;pos++;shown=false;startMc();renderFilters();render()}
$("prev").onclick=()=>{if(pos>0){pos--;shown=false;startMc();render()}};
let armed=false;
$("reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="本当にリセット？（もう一度タップ）";setTimeout(()=>{armed=false;e.target.textContent="記録をリセット"},3000);return}
  st={res:{}};save();armed=false;e.target.textContent="記録をリセット";build()};
document.addEventListener("keydown",e=>{if(fmt==="card"&&(e.key===" "||e.key==="Enter")){if(!shown&&pos<deck.length){e.preventDefault();shown=true;render()}}});
build();
</script>
