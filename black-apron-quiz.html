<style>
/* Layout: single centered study column — filters on top, one flash card, grading bar below */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --ink:#1d1b19; --muted:#6c665e; --line:#dcd6cc;
  --accent:#1e5a43; --accent-ink:#fff; --blank:#e7efe9; --ok:#1e7a4c; --ng:#b4442f;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1e1c1a; --ink:#ece8e1; --muted:#a39c92; --line:#36322e;
  --accent:#4fae86; --accent-ink:#0f1411; --blank:#1f3229; --ok:#5cc28f; --ng:#e07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1e1c1a; --ink:#ece8e1; --muted:#a39c92; --line:#36322e;
  --accent:#4fae86; --accent-ink:#0f1411; --blank:#1f3229; --ok:#5cc28f; --ng:#e07a63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem;margin:0}
.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.progress{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.tag{font-size:.75rem;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap}
.tag b{color:var(--accent);font-weight:700}
.q{font-size:1.05rem;font-weight:500;margin:0;word-break:break-word}
.blank{display:inline-block;background:var(--blank);border-radius:6px;padding:0 6px;margin:0 2px;color:var(--accent);font-weight:700}
.blank.filled{color:var(--ink);background:transparent;border-bottom:2px solid var(--accent);border-radius:0;padding:0 2px}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ans div{display:grid;grid-template-columns:1.6em 1fr;gap:6px}
.ans span:first-child{color:var(--accent);font-weight:700}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.ng{color:var(--ng);border-color:var(--ng)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{font-size:.75rem;font-weight:700}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}
.ghost{background:none;border:none;color:var(--muted);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:4px}
.done{text-align:center;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;cursor:pointer;display:grid;grid-template-columns:1.6em 1fr;gap:6px;align-items:baseline;min-width:0;word-break:break-word}
.choice .cn{color:var(--muted);font-weight:700;font-size:.85em}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice[disabled]{cursor:default;opacity:.55}
.choice.right{border-color:var(--ok);color:var(--ok);font-weight:700;opacity:1;border-width:2px}
.choice.wrong{border-color:var(--ng);color:var(--ng);opacity:1;text-decoration:line-through}
.blank.current{background:var(--accent);color:var(--accent-ink)}
.stepn{font-size:.75rem;color:var(--muted)}
.verdict{flex:1 0 100%;text-align:center;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.seg .chip{font-weight:700}
.bm{display:flex;gap:14px;align-items:flex-start;margin:auto 0}
.bm-ico{width:22px;flex:none;fill:var(--accent);margin-top:4px}
.bm-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.bm-title{margin:0;font-weight:700;font-size:1.05rem}
.bm-meta{margin:0;color:var(--muted);font-size:.85rem}
.qimg{display:block;max-width:100%;width:340px;border-radius:8px;border:1px solid var(--line);background:#fff;margin:0 auto}
.optlist{margin:0;padding-left:1.2em;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.choice.sel{border-color:var(--accent);background:var(--blank);font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
#cats{font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>

られる生豆を（③）と呼ぶ．また生豆を焙煎し，SCTCは（④）を行う．", [["①", "スイス"], ["②", "ローザンヌ"], ["③", "オファーサンプル"], ["④", "カッピング"]], null], ["生産地に出向き，サプライヤーや生産者を訪ねたり，カッピングルームに招待したりする役割を担うのは（6）である．", [["6", "グローバルコーヒークオリティチーム(GCQ)"]], null], ["スターバックスが定義する「高品質」について　・カッピング評価：（①）（②）（③）（④）（⑤）　・物理的評価：生豆の（⑥）と（⑦）含有量，生豆の（⑧），生豆の（⑨）と（⑩），（⑪）", [["①", "香り（アロマ）"], ["②", "酸味"], ["③", "コク（ボディ）"], ["④", "風味（フレーバー）"], ["⑤", "複雑さ"], ["⑥", "密度"], ["⑦", "水分"], ["⑧", "大きさ"], ["⑨", "色"], ["⑩", "形"], ["⑪", "欠陥数"]], null]], "src": "fy27"}, {"cat": "CA300 T6", "name": "経済的な透明性：適正価格を生産者に支払うこと", "items": [["コーヒーのサプライチェーン全体においてC.A.F.E.プラクティスの参加者には（①）の提出が義務付けられおり，スターバックスのサプライヤーは（②）購買している．", [["①", "支払証明書"], ["②", "透明性をもって"]], null], ["小規模農園，協同組合等からコーヒーを購買した後，購入者側へのコーヒーの輸送を取り計らう独立組織は（9）と呼ばれ，C.A.F.E.プラクティスの導入をサポートしてくれる．", [["9", "サプライヤー"]], null]], "src": "fy27"}, {"cat": "CA300 T6", "name": "社会的責任：労働者の権利を守ること，地域社会の支援", "items": [["社会的責任に関する指標の中で，最低賃金や労働に関する禁止事項の順守は義務であり，（①）（②）の方針が適用される．", [["①", "必須項目"], ["②", "ゼロ・トレランス"]], null], ["C.A.F.E.プラクティスのスコアカードの社会的責任の箇所は（7）以上の指標で構成されている．", [["7", "70"]], null], ["次のリストから社会的責任の指標として該当するものを全て選べ．・賃金と福利厚生　・気候変動　・水域の保護　・労働時間　・保護区域　・結社／団体交渉の自由　・地表浸食のコントロール　・住居へのアクセス　・教育へのアクセス　・水の消費量の削減　・野生動植物の保護　・医療ケアへのアクセス　・コーヒー用の日陰のメンテナンス　・労働者の安全と研修", [["答", "賃金と労働・労働時間・結社／団体交渉の自由・住居へのアクセス・教育へのアクセス・医療ケアへのアクセス・労働者の安全と研修"]], null]], "src": "fy27"}, {"cat": "CA300 T6", "name": "環境面でのリーダーシップ：水とエネルギーを守り，節約すること，生物多様性の維持", "items": [["環境面でのリーダーシップに関する指標の中で，農園は天然林を農業用地に変えたり，世界保健機関（WHO）が禁止している農薬を使用できないといった（①）（②）がある．", [["①", "必須項目"], ["②", "ゼロ・トレランス"]], null], ["次のリストから環境面でのリーダーシップの指標として該当するものを全て選べ．・賃金と福利厚生　・気候変動　・水域の保護　・労働時間　・保護区域　・結社／団体交渉の自由　・地表浸食のコントロール　・住居へのアクセス　・教育へのアクセス　・水の消費量の削減　・野生動植物の保護　・医療ケアへのアクセス　・コーヒー用の日陰のメンテナンス　・労働者の安全と研修", [["答", "気候変動・水域の保護・保護区域・地表浸食のコントロール・水の消費量の削減・野生動物の保護・コーヒー用の日陰のメンテナンス"]], null], ["C.A.F.E.プラクティスの社会的責任と環境面でのリーダーシップを監査している第三者機関は（11）である．", [["11", "SCS（Scientific Certification Systems）"]], null]], "src": "fy27"}, {"cat": "CA300 T6", "name": "生産者コミュニティへの投資", "items": [["コーヒーの購買は，「（①）」モデルと「（②）」モデルを通じて行わ，商業的な市場価格に（③）を上乗せした価格を特徴としている．（①）のメリットは，前もって価格が設定されることで，価格の予想ができることである．（②）のメリットは，経時的に価格が上昇しているときに販売者に有利な場合があることである．", [["①", "長期固定価格（long-term price fixed）"], ["②", "予定固定価格（price-to-be-fixed）"], ["③", "プレミアム"]], null], ["スターバックスが（13）を通じて合理的な条件による融資を提供することで，生産者は戦略的なインフラ投資ができ，日々の運営の安定性をもたらす．さらに，コーヒー産業全体の未来を守ることにも繋がる．", [["13", "グローバルファーマーファンド"]], null], ["「One Tree for Every Bag」プログラムとして（①）年に始まった（②）（③）イニシアティブは，ラテンアメリカにおけるさび病の発生との戦いを助ける試みである．（④）年までにさび病に抵抗力のある健康な木を（⑤）本提供することを目指している．", [["①", "2015"], ["②", "1億本のコーヒーの木"], ["③", "100 Million Coffee Trees"], ["④", "2025"], ["⑤", "1億"]], null], ["（①）は，コーヒーコミュニティが健全で安定するために，オリジン助成金として2千万ドル以上を提供してきた．職業訓練，水，医療サービスへのアクセス増大だけでなく，女性がリーダーシップを発揮する機会を促すための支援も行っており，女性の活躍に重きを置きつつ，（②）年までに最低（③）人の生活を向上させる目標を目指す．", [["①", "スターバックス・ファウンデーション"], ["②", "2025"], ["③", "100万"]], null]], "src": "fy27"}, {"cat": "CA300 用語集", "name": "Coffee Academy Level 300 用語集", "items": [["「One Tree for Every Bag」プログラムとして2015年に始まった、ラテンアメリカにおけるさび病の発生との戦いを助ける取り組み。さび病により、生産者は高品質なコーヒーをほとんど生産できなくなる。", [["1", "100 Million Coffee Trees（1億本のコーヒーの木）"]], null], ["世界中の生産者やサプライヤーと協力して働く、コーヒー農業と加工の専門家。", [["2", "Agronomist（アグロノミスト）"]], null], ["農園における土壌管理と作物生産に関する科学。", [["3", "Agronomy（農学）"]], null], ["コーヒーの木はジャスミンのような香りのデリケートな白い花を開花させる。花が散った後には緑のコーヒーチェリーの房が形成される。", [["4", "Bloom（開花）"]], null], ["Coffee And Farmer Equity プラクティスの略で、コンサベーション・インターナショナルとのパートナーシップのもと、スターバックスが作った包括的プログラムであり、第三者専門機関により認定されたコーヒー産業の最初のサステナビリティ基準の一つ。", [["5", "C.A.F.E. Practices（C.A.F.E. プラクティス）"]], null], ["コーヒーおよび商品取引の深い専門知識を有するパートナーから成る小さなチーム。スターバックスのバイヤーは「透明性をもって」購買するが、これはつまり、販売者に信頼してもらえる方法で安定した価格を提示し、品質に基づいた価格でコーヒーを購買するということである。", [["6", "Coffee Buyers（コーヒーバイヤー）"]], null], ["50ヘクタールを超える規模の、一か所でコーヒー栽培と加工をまかなうのに十分な大きさの農園。コーヒーを摘んだ後、出荷準備に必要なすべてを農園で行うことができる。", [["7", "Coffee Estate（エステート）"]], null], ["菌(Hemileia vastatrix fungus)によって引き起こされるコーヒーの木の葉の病気。", [["8", "Coffee Leaf Rust（さび病）コーヒーさび病"]], null], ["コーヒーの営業と販売を行う複数の小規模コーヒー生産者の組合。規模は様々で、100件から15,000件もの農園を含む場合がある。", [["9", "Cooperatives（協同組合）"]], null], ["50年以上も前にエチオピアで採取された、世界中のアラビカ種のコーヒーの遺伝学的に最も多様な100系統。スターバックスはコア コレクションを最初に受け取った組織のうちの一社で、より抵抗力のあるハイブリッド種を開発する目的でハシエンダ アルサシア農園においてアラビカ種の遺伝学的な多様性を研究するためにこれらの系統を使用している。", [["10", "Core Collection（コア コレクション）"]], null], ["果皮（外皮）や果肉をコーヒー豆から取り除くプロセス。", [["11", "De-pulping（果肉除去）"]], null], ["果皮と果肉の中間層、そして多くの場合は1つの種を内包する硬い内殻のある桃やチェリー、プラムなどのフルーツ。コーヒーチェリーは核果の一種である。", [["12", "Drupe（核果）"]], null], ["水洗式加工においては、パーチメントに包まれたまま、コーヒー豆は乾燥される。", [["13", "Drying（乾燥）"]], null], ["パーチメントを生豆から取り除くまでのプロセス。ドライミリングはコーヒーを袋詰めして輸送準備を整える前の最後の手順であり、果肉除去および乾燥工程が終わり、最長2か月ねかせた後に行われる。", [["14", "Dry Milling（ドライミリング）"]], null], ["コーヒーが責任あるサステナブルな方法で入手されるようにすること", [["15", "Ethical Sourcing（エシカルな調達）"]], null], ["コーヒー生産者とそのコミュニティのサポートを専門とするスターバックスのオフィス。FSCのアグロノミストや品質の専門家は、より優れたコーヒーの栽培、コーヒーの品質や生産性の向上、生産コスト管理、C.A.F.E.プラクティスの実施支援等を通して、生産者と協働している。2021年現在主要なコーヒー生産地域に10のFSCがある。", [["16", "Farmer Support Center (FSC)（ファーマーサポートセンター）"]], null], ["果肉除去後のコーヒー豆をタンクにねかせ、酵素等の働きにより残った果肉や粘液をコーヒー豆から離す加工の段階。", [["17", "Fermentation（発酵）"]], null], ["毎年主な収穫期に続いて行われる2回目のコーヒーの収穫期。フライクロップはコロンビアとケニアを含む少数の赤道諸国において行われている。", [["18", "Fly-Crop (Mitaca)（フライクロップ（ミタカ））"]], null], ["スターバックスのグローバルファーマーファンドはコーヒー生産者に5千万ドルを融資する基金。これらの貸付金を通じて、スターバックスにコーヒーを供給しない生産者に対しても農学やインフラの改善をサポートすることができる。", [["19", "Global Farmer Fund（グローバルファーマーファンド）"]], null], ["焙煎されていないコーヒー豆。ほとんどのコーヒーチェリーの中には、側面が平らな2つの豆が互いに向き合った状態で入っている。", [["20", "Green Bean（生豆）"]], null], ["1970年代から経営されているコスタリカ アラフエラのコーヒー農園。2013年にスターバックスが購入し、240ヘクタールの敷地にはウェットミルとドライミルが設置されており、スターバックス グローバルアグロノミー研究開発センターの敷地でもある。", [["21", "Hacienda Alsacia（ハシエンダ アルサシア農園）"]], null], ["熟したコーヒーチェリーが木から摘み取られる時期のこと。多くの国では高品質なアラビカ種のコーヒーチェリーは手作業で摘み取られる", [["22", "Harvest（収穫期）"]], null], ["何世代にもわたって生産者から生産者へと伝えられてきたか、野生で育ってきた品種。エチオピアには何千ものエアルーム種が育っており、コーヒー研究家が日々それらについて多くのことを学んでいる。", [["23", "Heirloom（エアルーム）"]], null], ["ハニープロセスは加工法の分類としては半水洗式のうちの一つで、コスタリカやその他の中央アメリカで一般的である。発酵は行わず、粘液をパーチメントに残したまま、乾燥させる。ハニープロセスは、コーヒー豆に付いた粘液の量により、色で分類される。", [["24", "Honey Processing（ハニープロセス）"]], null], ["コーヒーをねかせた後、脱殻機でパーチメントを生豆から取り除くプロセスのこと。これにより、生豆は焙煎前の最後の状態になる。", [["25", "Hulling（脱殻（皮むき））"]], null], ["局所の温度、日射量および降水量のこと。微気候は、わずか数平方フィートの場合もあれば、何平方マイルにまで及ぶこともある。コーヒーに関しては、微気候によって狭い地域内でも独特の風味のプロファイルが生まれることがある。", [["26", "Microclimate（微気候）"]], null], ["小さな加工場を有する、エステートより規模の小さな農園のこと。通常、この規模の農園には果肉除去機と発酵タンクが一つずつある。", [["27", "Micro-estates（マイクロ エステート）"]], null], ["コーヒーの生豆を覆う甘くて粘り気のあるハチミツのような物質。", [["28", "Mucilage（粘液（ミューシレージ））"]], null], ["（乾燥式）この方法はチェリーの果実をコーヒー豆に付けたまま乾燥するため、果実や粘液の風味がコーヒー豆に染み込む。加工には水を一切使わない。", [["29", "Natural (Sun-Dried or Dry) Processing"]], null], ["オープンソース アグロノミー（農学）は、研究や調査結果をコーヒー産業全体が利用できるようにするアプローチ。スターバックスは、最新研究、ツール、ベストプラクティス、リソースを、スターバックスにコーヒーを販売するか否かに関わらず世界中の生産者と共有している。", [["30", "Open Source（オープンソース）"]], null], ["コーヒーチェリーの一番外側の皮。", [["31", "Outer Skin（果皮（外皮））"]], null], ["コーヒー豆を保護する層。", [["32", "Parchment（パーチメント（内果皮））"]], null], ["側面が平らな2つのコーヒー豆が入っているものに対して、5〜10%の割合で見られる単一の丸いコーヒー豆。", [["33", "Peaberry（ピーベリー）"]], null], ["熟したコーヒーチェリーから果実の層や保護する層を取り除き、生豆を取り出すプロセス。", [["34", "Processing（加工）"]], null], ["将来的に木がよりよく成長するようにコーヒーの木から枝を刈り取ること。生産者は剪定の機会に木を5〜6フィート（1.5〜1.8メートル）にやり取ることがある。こうすることで生産性を高めたりコーヒーチェリーの収穫を比較的容易にできる。", [["35", "Pruning（剪定）"]], null], ["主に糖分と水からなる、コーヒーチェリーの総重量の80%を占める層。", [["36", "Pulp（果肉）"]], null], ["ブラジルで最も一般的で、水洗式と乾燥式の双方の特徴を持つ方法。収穫後、チェリーの果肉を除去し、部分的に粘液を取り除き、パーチメント上に粘液の一部を残したまま乾かす。発酵プロセスはない。", [["37", "Pulped Natural Processing（パルプドナチュラル）"]], null], ["乾燥を終えたパーチメントのついた生豆を、袋に入れて倉庫に移し、最長2か月ねかせること。", [["39", "Resting（ねかせる）"]], null], ["SCSはC.A.F.E.プラクティスの第三者検証者である。信頼できる第三者機関による認証と監査を提供することで、環境に関する監督と報告の責務、社会的責任を促進している。", [["40", "SCS GLOBAL SERVICES（SCSグローバルサービス）"]], null], ["収穫期の間、農園から農園に熟したコーヒーチェリーを追って移動する労働者、こうした移動は特定の一か国内であることも、複数の国にわたることもある。", [["41", "Seasonal Workers（季節労働者）"]], null], ["熟したチェリーのみを確実に摘むために、収穫者が同じ木に複数回戻ること。", [["42", "Selective Harvesting（選択的収穫）"]], null], ["自らの花粉で受粉してチェリーを実らせることができる花。コーヒーの木は自家受粉する。", [["43", "Self-Pollinating（自家受粉）"]], null], ["主にインドネシアの島々の小規模生産者が採用している加工法。粘液を大まかにのみ取り除き、発酵させず、豆を半分湿った状態で脱殻する点で水洗式と異なる。", [["44", "Semi-washed (Wet-Hulled) Processing（半水洗式（ウェットハル式））"]], null], ["コーヒーは20フィート（6.1メートル）のコンテナで貨物船に積み込まれ、スターバックスのいずれかの焙煎工場近くの港まで輸送される。", [["45", "Shipping Container（輸送コンテナ）"]], null], ["薄いほとんど透明のグリーンビーンの最後の保護層", [["46", "Silver Skin（シルバースキン（銀皮））"]], null], ["規模の小さい2〜5ヘクタールのコーヒー農園のこと。スターバックスが購買するコーヒーのほとんどは小規模農園で栽培される。", [["47", "Smallholder Farms（小規模農園）"]], null], ["スイス、ローザンヌにある、世界中のスターバックスの生豆の購買管理に責任を持つ会社。", [["48", "Starbucks Coffee Trading Company(SCTC)（スターバックス コーヒートレーディング カンパニー）"]], null], ["コスタリカ、アラフエラのハシエンダアルサシア農園内にある施設で、世界中のコーヒー農業コミュニティの気候変動による影響を軽減し、作物の長期的サステナビリティを促すことに専念している。", [["49", "Starbucks Global Agronomy Research & Development Center（スターバックス グローバルアグロノミー研究開発センター）"]], null], ["コーヒーを世界で最初のサステナブルな農産物にすることを目指した、コンサベーション・インターナショナル主導の取り組み。", [["50", "Sustainable Coffee Challenge（サステナブル・コーヒー・チャレンジ）"]], null], ["コーヒーの品質と風味に多大な影響を及ぼす土壌、地形、気候の局地的な組み合わせ。", [["51", "Terroir（テロワール）"]], null], ["教育訓練や清潔な水、衛生、医療サービスへのアクセス拡大を通じて生産者をサポートしている基金。女性がリーダーシップを取る機会も保進しており、教育障壁の打破や経済的機会の増大も助けている。", [["52", "The Starbucks Foundation（スターバックス・ファウンデーション）"]], null], ["単一栽培品種のコーヒーの木から産出されたコーヒー、コーヒー用語の「品種」は、単一の地域または国を産地とするコーヒーの表現にも使われる。品種の外観の違いは、葉の構造やチェリーが枝に房になって育つ様子に大抵表れる。長くひょろりとした木もあれば、コンパクトで小さな木もある。", [["53", "Varietal（品種）"]], null], ["世界中で最も広く行われている加工法。その名が示す通り、この加工法には清潔な水へのアクセスが必要である。", [["54", "Washed (Wet) Processing（水洗式）"]], null], ["コーヒーの遺伝学、分子生物学、知覚科学に重点を置くことでコーヒーの未来を創出している非営利組織、最高のコーヒーの品種を生産者に届けるために取り組み、「From Seed to Cup(種からカップまで)」のスタンスで、コーヒーの品質の改良に取り組んでいる。", [["55", "World Coffee Research（ワールドコーヒーリサーチ）"]], null]], "src": "fy27"}, {"cat": "CA300 ロースト", "name": "Ticket 1 スターバックスのローストの歴史", "items": [["西暦（①）年、スターバックスの最初の創業者たちとシアトルのカフェ（②）の（③人物名）が協力して、スターバックスの（④）を作った。", [["①", "1975年"], ["②", "カフェ アレグロ"], ["③", "デイブ オルセン"], ["④", "エスプレッソ ロースト"]], null], ["西暦（①）年、ロースト直後のコーヒーを密封できるようにした技術は（②）である。", [["①", "1985年"], ["②", "フレーバーロックバッグ"]], null], ["西暦（①）年、店舗で毎日提供できる、なめらかでローストを抑えた味わいのブレンドの（②）を発売。", [["①", "2008年"], ["②", "パイクプレイスロースト"]], null], ["西暦（①）年、ブロンド ロースト コーヒーを発売、新しいコーヒーファンを歓迎することができた。", [["①", "2011年"]], null]], "src": "fy27"}, {"cat": "CA300 ロースト", "name": "Ticket 2 ローストの芸術と科学", "items": [["スターバックスではコーヒーを（①）（②）（③）のローストカテゴリーに分類している。", [["①", "スターバックス ブロンド ロースト"], ["②", "スターバックス ミディアム ロースト"], ["③", "スターバックス ダーク ロースト"]], null], ["ローストのアプローチを決定するとき、コーヒー開発チームは、際立たせたい（①）と（②）を強調したいか和らげたいか、また望ましい（③）にも注意が払われる。", [["①", "風味"], ["②", "酸味"], ["③", "コク"]], null], ["（①）とは、ある地理上の場所で生産されるコーヒーで、ある国、国の中のある地域、ときにはたった1つの農場や農園から調達されたコーヒーを説明する用語。淹れた時にその生産地をを特有の形で表現するが、これを「②」と呼ぶ。", [["①", "シングルオリジン"], ["②", "テロワール（土地の味）"]], null], ["コーヒーの生産国では生豆を（①○kg〜○kg）の袋に入れる。出荷前に、スイスの（②）にある（③）で、（④）をテイスティングして品質を確認する。（④）の（⑤）%が受け入れられ、却下されたサンプルはサプライヤーに返却される。承認された生豆はコンテナ（⑥○ポンド〜○ポンドが入る）に入れられ、コンテナが1ロットになる。コンテナは各ロースト工場に送られる。", [["①", "59kg〜70kg"], ["②", "ローザンヌ"], ["③", "スターバックス コーヒー トレーディング カンパニー（SCTC）"], ["④", "出荷前サンプル"], ["⑤", "90%"], ["⑥", "4万〜4万5千ポンド"]], null], ["スターバックスのロースト工場　6か所", [["①", "米国、ワシントン州ケント"], ["②", "米国、ペンシルバニア州ヨーク"], ["③", "米国、ネバダ州カーソンバレー"], ["④", "米国、サウスカロライナ州サンディーラン"], ["⑤", "米国、ジョージア州オーガスタ"], ["⑥", "オランダ、アムステルダム"]], null], ["スターバックス リザーブ ロースタリー　6か所", [["①", "米国、ワシントン州シアトル"], ["②", "中国、上海"], ["③", "イタリア、ミラノ"], ["④", "米国、ニューヨーク州ニューヨーク"], ["⑤", "日本、東京"], ["⑥", "米国、イリノイ州シカゴ"]], null], ["倉庫でコーヒーを下した後、（①）のカッピングを行う。麻袋の外から挿入できる（②）を使って、各ロットの袋の（③）%から生豆を取り出す。こうした少量のコーヒーを合わせて約（④）ポンドの代表サンプルを作り、シアトルの（⑤）に送る。このプロセスには（⑥）日かかる。受け取った日の翌日にロースト、その翌日に（⑤）がカッピングする。輸送中のダメージがなかったことと、（⑦）で設定された期待事項と品質が一致していることを確認する。", [["①", "到着サンプル"], ["②", "サンプラー"], ["③", "10%"], ["④", "2ポンド（1kg弱）"], ["⑤", "グローバル コーヒー クオリティ（GCQ）"], ["⑥", "3日"], ["⑦", "出荷前サンプル"]], null], ["生豆は工場に輸送され、まず網目・バキューム・磁石により異物を除去されます。焙煎機では（①○ポンド〜○ポンド）のコーヒーが一度にローストでき、約（②○℃〜○℃）で加熱します。", [["①", "400〜650ポンド"], ["②", "180〜240℃"]], null], ["加熱開始から約6分後黄色ぽく変化し、（①○分〜○分）後、ぱちぱち音がする（②）が起こり、倍の大きさになる。この時豆の真ん中には（③）ができる。この状態を（④）ローストと呼ばれる。", [["①", "6〜9分"], ["②", "ファーストポップ"], ["③", "センターカット"], ["④", "シナモンロースト"]], null], ["水分がますます失われるにつれ、豆の色は濃くなり続け、表面がわずかにざらざらになり、濃い色の線が現れ始める。この状態を（①）ローストと呼ばれる。", [["①", "シティロースト"]], nul "]], null], ["地球温暖化に大きな影響をもたらしているのはなんでしょう？", [["6", "二酸化炭素【二酸化炭素などによる温室効果ガスの増加は、地球の気温を上昇させます。】"]], null], ["スターバックスでは、コーヒーの収穫前に現金不足になってしまった生産者のために実施していることがあります。それはなんでしょう？", [["7", "低金利融資【現金不足により完熟前のコーヒーチェリーを安い価格で販売することを防ぐことにつながります。】"]], null], ["コーヒー生産地にも影響を与えている、太平洋赤道域の日付変更線付近から南米沿岸にかけて、海面水温が平年より高くなり、その状態が1年程度続く現象をなんというでしょう？", [["8", "エルニーニョ現象【これにより、ラテンアメリカでの降雨量に異変が起こり、収穫に影響が出ています。】"]], null], ["コーヒーの木の病気であるさび病を防ぐ対策として、スターバックスが行なっているのはなんでしょう？", [["9", "病気に強い品種の開発【生産地にあるファーマーサポートセンターで、さび病に強い品種の苗を開発し、農家に無償で提供しています。】"]], null], ["コーヒーの木の病気で深刻な影響を与えるさび病にかかると葉に何色の斑点ができるでしょう？", [["10", "オレンジ【さび病はカビの一種です。さび病にかかると、葉にオレンジ色の斑点ができ、そのうち葉全体に広がり、葉が枯れ落ちてしまいます。他の木にもうつり、葉から葉へ感染していき、最終的には木全体の葉を枯らしてしまいます。】"]], null], ["私たちに恵みをもたらす、天然資源(植物や生物、大気、水、土、鉱物など)を何というでしょう？", [["11", "自然資本【自然のもたらしてくれる恵みは無限ではありません。その恵みが将来にわたり続くよう、自然の価値を評価し、私たちの生活や企業活動が自然からどんな恵みを受けているか、反対に自然にどんな影響を与えているか理解し、行動することが求められています。】"]], null], ["地球温暖化の主な原因にあてはまらないものは何でしょう？(火山活動 or 人間の経済活動による温室効果ガスの増加 or 森林破壊によるCO2吸収力の低下)", [["12", "火山活動【二酸化炭素などによる温室効果ガスの増加は、地球の気温を上昇させます。】"]], null], ["日本の地球温暖化対策として、温室効果ガスの削減目標は、2030年度までに2013年度対比で何パーセントを掲げているでしょう？", [["13", "26%【2030年度までに2013年度対比温室効果ガスを26%削減する目標を掲げています。】"]], null], ["2015年12月に開催された第21回国連気候変動枠組み条約締約国会議(COP21)において、2020年以降の温室効果ガス排出削減等のための新たな国際枠組みとして採択された協定を何というでしょう？", [["14", "パリ協定【2015年12月、フランスのパリで開催された第21回国連気候変動枠組み条約締約国会議(COP21)においては、2020年以降の温室効果ガス排出削減等のための新たな枠組みとして、パリ協定が採択されました。】"]], null], ["スターバックスが取り組んでいる店舗の環境負荷低減の一環として、環境性能が優れた店舗について取得している環境認証を何というでしょう？", [["15", "LEED(リード)認証【福岡大濠公園店、京都リサーチパーク店、東急プラザ 表参道原宿店など7店舗が認証されています。(2017年)】"]], null]], "src": "fy27"}, {"cat": "エシカルクイズ編", "name": "エシカルクイズvol.5", "items": [["ショートサイズのスターバックス ラテ1杯にコーヒーチェリーは何粒必要か？ヒント：スターバックス ラテ1杯にはエスプレッソショット1杯分を使用しています。", [["答", "25粒"]], null, {"mc": ["15粒", "25粒", "100粒"]}], ["現在、コーヒーは世界の約何ヶ国で栽培されているでしょう？（2021年）", [["答", "約70ヶ国"]], null, {"mc": ["約18ヶ国", "約33ヶ国", "約70ヶ国"]}], ["気候変動などにより、2050年までにアラビカ種のコーヒー栽培に適した土地が減少すると言われています。何%？", [["答", "50%"]], null, {"mc": ["80%", "50%", "15%"]}], ["生産地から長い旅を経て const ansHtml=it=>`<div class="ans">${it.a.map(([n,a])=>`<div><span>${n==="答"?"":n}</span><span>${esc(a).replace(/\n/g,"<br>")}</span></div>`).join("")}</div>`;

function render(){
  const total=deck.length;
  $("barfill").style.width=total?(Math.min(pos,total)/total*100)+"%":"0";
  $("score").textContent=`○ ${sessOk}　× ${sessNg}`;
  const card=$("card"),ctr=$("controls");
  if(pendingResume){const b=pendingResume,d=new Date(b.t);
    $("pos").textContent=`しおり ${b.pos} / ${b.ids.length}`;$("score").textContent=`○ ${b.ok}　× ${b.ng}`;
    $("barfill").style.width=(b.pos/b.ids.length*100)+"%";
    card.innerHTML=`<div class="bm">
      <svg class="bm-ico" viewBox="0 0 24 32" aria-hidden="true"><path d="M2 0h20v32l-10-8-10 8z"/></svg>
      <div class="bm-body"><p class="bm-title">しおりがあります</p>
      <p class="bm-meta">${esc(comboLabel())}</p>
      <p class="bm-meta">${b.pos+1}問目から（全${b.ids.length}問）　${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} に保存</p></div></div>`;
    ctr.innerHTML=`<button class="btn" id="fresh">最初から</button><button class="btn primary" id="resume">続きから</button>`;
    $("resume").onclick=resume;$("fresh").onclick=fresh;return}
  if(!total){$("pos").textContent="0 / 0";card.innerHTML=`<p class="done">${mode==="wrong"?"×の問題はありません。":"問題がありません。"}</p>`;ctr.innerHTML="";return}
  if(pos>=total){$("pos").textContent=`${total} / ${total}`;
    card.innerHTML=`<p class="done" style="margin:auto">おつかれさま！<br>○ ${sessOk}問　× ${sessNg}問</p>`;
    ctr.innerHTML=`<button class="btn primary" id="again">もう一度</button>`;$("again").onclick=build;return}
  const it=deck[pos],r=st.res[it.id];
  $("pos").textContent=`${pos+1} / ${total}`+(pos>0?"　しおり保存中":"");
  const img=it.ex&&it.ex.img?`<img class="qimg" src="${it.ex.img}" alt="問題の地図">`:"";
  const tag=`<div class="tag"><b>${esc(it.cat)}</b><span>${esc(it.name)}</span>${r?`<span class="mark ${r}">前回 ${r==="ok"?"○":"×"}</span>`:""}</div>`;

  if(fmt==="card"){
    const opts=it.ex&&(it.ex.mc||it.ex.multi)?`<ul class="optlist">${(it.ex.mc||it.ex.multi).map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:"";
    card.innerHTML=`${tag}${img}<p class="q">${qHtml(it,()=>shown?"filled":"")}</p>${opts}${shown?ansHtml(it):""}`;
    if(!shown){ctr.innerHTML=`<button class="btn primary" id="show">答えを見る</button>`;$("show").onclick=()=>{shown=true;render()}}
    else{ctr.innerHTML=`<button class="btn ng" id="ng">× まちがえた</button><button class="btn ok" id="ok">○ 正解</button>`;
      $("ok").onclick=()=>grade("ok");$("ng").onclick=()=>grade("ng")}
    return;
  }
  // 4択
  if(mc.multi){const m=mc;
    const ch=`<p class="stepn">あてはまるものを全て選んでください</p><div class="choices" role="group">${m.choices.map((c,i)=>{
      let cls="choice";const on=m.sel.has(i);if(m.done){if(m.correct.has(i))cls+=" right";else if(on)cls+=" wrong";}else if(on)cls+=" sel";
      return `<button class="${cls}" data-i="${i}" aria-pressed="${on}" ${m.done?"disabled":""}><span class="cn">${on?"✓":""}</span>${esc(c)}</button>`}).join("")}</div>`;
    card.innerHTML=`${tag}${img}<p class="q">${esc(it.q)}</p>${ch}${m.done?ansHtml(it):""}`;
    card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;m.sel.has(i)?m.sel.delete(i):m.sel.add(i);render()});
    if(!m.done){ctr.innerHTML=`<button class="btn primary" id="sub" ${m.sel.size?"":"disabled"}>決定</button>`;$("sub").onclick=()=>{m.done=true;render()};return}
    const g=m.sel.size===m.correct.size&&[...m.sel].every(i=>m.correct.has(i))?"ok":"ng";
    ctr.innerHTML=`<div class="verdict ${g}">${g==="ok"?"○ 正解":"× まちがい"}</div><button class="btn primary" id="nx">次の問題へ</button>`;
    $("nx").onclick=()=>grade(g);return}
  const m=mc,last=m.step===it.a.length-1,done=m.picked!==null&&last;
  const state=i=>i<m.step||(i===m.step&&m.picked!==null)?"filled":i===m.step?"current":"";
  const set=m.sets[m.step],[n]=it.a[m.step];
  const multi=it.a.length>1?`<span class="stepn">空欄 ${m.step+1} / ${it.a.length}</span>`:"";
  const ch=`<div class="choices" role="group" aria-label="${n}の選択肢">${set.choices.map((c,i)=>{
    let cls="choice";if(m.picked!==null){if(c===set.correct)cls+=" right";else if(i===m.picked)cls+=" wrong";}
    return `<button class="${cls}" data-i="${i}" ${m.picked!==null?"disabled":""}><span class="cn">${n==="答"?"":n}</span>${esc(c)}</button>`}).join("")}</div>`;
  const qline=fmt==="pair"?`<p class="q">「${esc(it.name)}」と相性の良い風味は？</p>`:`<p class="q">${qHtml(it,state)}</p>`;
  card.innerHTML=`${tag}${fmt==="pair"?"":img}${qline}${multi}${ch}${done&&fmt!=="pair"?ansHtml(it):""}`;
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;m.picked=i;if(set.choices[i]!==set.correct)m.allOk=false;render()});
  if(m.picked===null){ctr.innerHTML="";return}
  if(!last){ctr.innerHTML=`<button class="btn primary" id="nx">次の空欄へ</button>`;$("nx").onclick=()=>{m.step++;m.picked=null;render()}}
  else{const g=m.allOk?"ok":"ng";
    ctr.innerHTML=`<div class="verdict ${g}">${g==="ok"?"○ 正解":"× まちがい"}</div><button class="btn primary" id="nx">次の問題へ</button>`;
    $("nx").onclick=()=>grade(g)}
}
function grade(g){st.res[deck[pos].id]=g;save();g==="ok"?sessOk++:sessNg++;pos++;shown=false;saveBM();startMc();renderFilters();render()}
$("prev").onclick=()=>{if(pendingResume)return;if(pos>0){pos--;shown=false;saveBM();startMc();render()}};
let armed=false;
$("reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="本当にリセット？（もう一度タップ）";setTimeout(()=>{armed=false;e.target.textContent="記録をリセット"},3000);return}
  st={res:{}};save();bm={last:null,list:{}};saveBMs();armed=false;e.target.textContent="記録をリセット";build()};
document.addEventListener("keydown",e=>{if(fmt==="card"&&(e.key===" "||e.key==="Enter")){if(!shown&&pos<deck.length){e.preventDefault();shown=true;render()}}});
$("subt").textContent=`FY27 問題集・全${ALL.length}問`;
build();
</script>

</body>
</html>
